<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Conversão de Grau</title>
</head>

<body>
    <div class="container">
        <div class="container__conteudo">
            <div class="container__informacoes">
                <div class="container__texto">
                    <h1 class="container__texto-azul"> Conversor de graus</h1>

                    <div class="container__campo">
                        <label class="texto__paragrafo">Converter para</label>
                        <select class="container__input" id="tipo-graus">
                            <option value="fahrenheit">Fahrenheit</option>
                            <option value="kelvin">Kelvin</option>
                        </select>
                    </div>   

                    <div class="container__campo">
                        <label class="texto__paragrafo">Graus Celsius</label>
                        <input class="container__input" id="graus" type="number" min="1">
                    </div>
                    
                </div>
                
                <div class="chute container__botoes">
                    <button onclick="converter()" id="btn-sortear" class="container__botao">Converter</button>
                </div>

                <div class="container__texto" id="resultado">
                    <label class="texto__paragrafo">Resultado da conversão: </label>
                </div>
            </div>

            <img src="./img/graus.jpg" alt="Ilustração de Celsius, Fahrenheit e Kelvin" class="container__imagem" />
        </div>
    </div>

    <footer class="assinatura">
        <p class="assinatura__texto">Desenvolvido por Tales Melo<br>© 2025</p>
    </footer>    

    <script src="app.js" defer></script>
</body>

</html>
